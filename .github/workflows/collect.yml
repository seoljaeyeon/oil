name: 유가 수집

on:
  schedule:
    # 한국시간 매일 09:20, 18:20 (UTC 00:20, 09:20)
    - cron: "20 0,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 오피넷에서 가격 받기
        env:
          OPINET_KEY: ${{ secrets.OPINET_KEY }}
        run: python scripts/collect.py
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "유가 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
