<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기름값 추적</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기름값">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: header with selectors → today card → trend chart → region ranking → cheapest stations */
:root{
  --bg:#f4f4f1; --surface:#fff; --ink:#1d1f22; --muted:#6c7178; --line:#e4e4df;
  --accent:#c2410c; --accent-soft:#fdeee5; --up:#c62f2f; --down:#1f6fd1; --mine:#1d1f22;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121315; --surface:#1b1d20; --ink:#eceeef; --muted:#9aa0a6; --line:#2b2e33; --accent:#fb923c; --accent-soft:#3a2416; --up:#f07272; --down:#6aa9f0; --mine:#eceeef; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#121315; --surface:#1b1d20; --ink:#eceeef; --muted:#9aa0a6; --line:#2b2e33; --accent:#fb923c; --accent-soft:#3a2416; --up:#f07272; --down:#6aa9f0; --mine:#eceeef; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:20px}
.sub{font-size:12px;color:var(--muted)}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 0;border-radius:8px;font-weight:500;color:var(--muted);font-size:14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.big small{font-size:15px;font-weight:500;color:var(--muted);margin-left:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}
.rank{display:grid;grid-template-columns:22px 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.rank .bar{grid-column:2/4;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:-3px}
.rank .bar i{display:block;height:100%;background:var(--muted)}
.rank .me{font-weight:700}
.rank .bar.me i{background:var(--accent)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t2{font-size:12px;color:var(--muted)}
.banner{background:var(--accent-soft);color:var(--accent);padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.5}
svg text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:3px}
.range{display:flex;gap:6px;margin-bottom:8px}
.range button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.range button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:14px 0;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <header><div><h1>기름값 추적</h1><div class="sub" id="upd">불러오는 중…</div></div><select id="region" aria-label="지역"></select></header>
  <div class="seg" id="fuelSeg"></div>
  <div id="main"></div>
  <p class="sub" style="text-align:center">자료: 한국석유공사 오피넷 · 매일 2번 자동 수집</p>
</div>
<script>
(function(){
const FUELS={B027:"휘발유",D047:"경유",K015:"LPG",B034:"고급휘발유"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>n==null?"-":Math.round(n).toLocaleString("ko-KR");
const st={region:null, fuel:"B027", range:30, db:null, cfg:{}};
const load=k=>{ try{ return localStorage.getItem("oil-"+k); }catch(e){ return null; } };
const save=(k,v)=>{ try{ localStorage.setItem("oil-"+k,v); }catch(e){} };

async function getJSON(u){ const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }

function nationalOf(avg, fuel){
  const key=Object.keys(avg).find(n=>n.includes("전국"));
  if(key) return avg[key][fuel];
  const vals=Object.entries(avg).map(([,v])=>v[fuel]).filter(v=>v!=null);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;  // 전국 값이 없으면 시도 평균으로 대신
}

function render(){
  const db=st.db, h=db.history||[], F=st.fuel, R=st.region;
  $("fuelSeg").innerHTML=Object.entries(FUELS).map(([k,v])=>`<button data-f="${k}" class="${k===F?"on":""}">${v}</button>`).join("");
  if(!h.length){ $("main").innerHTML=`<div class="banner">아직 모인 데이터가 없어요. 저장소 Actions 탭에서 「유가 수집」을 한 번 실행해 주세요.</div>`; return; }
  const last=h[h.length-1], cur=(last.avg[R]||{})[F];
  const at=(n)=>{ const t=h[h.length-1-n]; return t? (t.avg[R]||{})[F] : null; };
  const d1=cur!=null&&at(1)!=null?cur-at(1):null;
  const back=(days)=>{ const target=new Date(last.date); target.setDate(target.getDate()-days); const t=[...h].reverse().find(x=>new Date(x.date)<=target); return t? (t.avg[R]||{})[F] : null; };
  const w=back(7), m=back(30), nat=nationalOf(last.avg,F);
  const delta=(a,b,label)=>{ if(a==null||b==null) return ""; const d=a-b; return `<span class="pill">${label} <b class="${d>0?"up":d<0?"down":""}">${d>0?"▲":d<0?"▼":""}${won(Math.abs(d))}</b></span>`; };
  let html=`<section class="card"><h2><span>${esc(R)} 평균 ${FUELS[F]}</span><span>${esc(last.date)}</span></h2>
    <div class="big num">${won(cur)}<small>원/L</small></div>
    <div class="chips">${delta(cur,at(1),"전날보다")}${delta(cur,w,"1주 전보다")}${delta(cur,m,"한 달 전보다")}${nat!=null?`<span class="pill">전국 평균 ${won(nat)} (${cur-nat>=0?"+":""}${won(cur-nat)})</span>`:""}</div>
    <p class="sub" style="margin:10px 0 0">50L 넣으면 약 <b class="num">${won(cur*50)}원</b></p></section>`;
  // chart
  const pts=h.slice(-st.range).map(x=>({d:x.date, v:(x.avg[R]||{})[F], n:nationalOf(x.avg,F)})).filter(p=>p.v!=null);
  html+=`<section class="card"><h2><span>가격 추이</span></h2><div class="range">${[[30,"1개월"],[90,"3개월"],[365,"1년"]].map(([n,l])=>`<button data-r="${n}" class="${st.range===n?"on":""}">${l}</button>`).join("")}</div>${chart(pts)}
    <div class="legend"><span><i style="background:var(--accent)"></i>${esc(R)}</span><span><i style="background:var(--muted)"></i>전국</span></div></section>`;
  // ranking
  const rows=Object.entries(last.avg).filter(([n,v])=>v[F]!=null && !n.includes("전국")).map(([n,v])=>({n,p:v[F]})).sort((a,b)=>a.p-b.p);
  if(rows.length){
    const lo=rows[0].p, hi=rows[rows.length-1].p;
    html+=`<section class="card"><h2><span>오늘 시도별 ${FUELS[F]} (싼 순)</span></h2><div class="rank">${rows.map((r,i)=>{ const me=r.n===R; return `<span class="sub num">${i+1}</span><span class="${me?"me":""}">${esc(r.n)}</span><span class="num ${me?"me":""}">${won(r.p)}</span><div class="bar ${me?"me":""}"><i style="width:${hi>lo?15+85*(r.p-lo)/(hi-lo):50}%"></i></div>`; }).join("")}</div></section>`;
  }
  // cheapest stations
  const cs=(db.cheapest||[]).filter(s=>s.fuel===F).sort((a,b)=>a.price-b.price);
  html+=`<section class="card"><h2><span>${esc(db.cheapest_region||R)} 싼 주유소 ${FUELS[F]}</span></h2>`;
  if(!cs.length) html+=`<div class="empty">아직 정보가 없어요. 인증키가 이 기능을 지원하지 않으면 평균가격만 보여요.</div>`;
  cs.slice(0,10).forEach(s=>{ html+=`<div class="row"><span><div>${esc(s.name)}</div><div class="t2">${esc(s.addr)}</div></span><b class="num">${won(s.price)}</b></div>`; });
  html+=`</section>`;
  $("main").innerHTML=html;
}

function chart(pts){
  if(pts.length<2) return `<div class="empty">이틀 이상 쌓이면 그래프가 그려져요.</div>`;
  const vals=pts.flatMap(p=>[p.v,p.n]).filter(v=>v!=null), lo=Math.floor(Math.min(...vals)/10)*10-10, hi=Math.ceil(Math.max(...vals)/10)*10+10;
  const W=340,H=170,L=40,B=22,T=10, x=i=>L+i*(W-L-8)/(pts.length-1), y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  let g=""; const step=Math.max(10,Math.ceil((hi-lo)/4/10)*10);
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step) g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v.toLocaleString("ko-KR")}</text>`;
  const line=(k,col,wd)=>{ const d=pts.map((p,i)=>p[k]==null?"":(i?"L":"M")+x(i).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" "); return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linejoin="round"/>`; };
  g+=line("n","var(--muted)",1.5)+line("v","var(--accent)",2.5);
  const lp=pts[pts.length-1]; g+=`<circle cx="${x(pts.length-1)}" cy="${y(lp.v)}" r="4" fill="var(--accent)"/>`;
  [0,Math.floor((pts.length-1)/2),pts.length-1].forEach(i=>{ g+=`<text x="${x(i)}" y="${H-5}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${+pts[i].d.slice(5,7)}/${+pts[i].d.slice(8)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="가격 추이">${g}</svg>`;
}

$("fuelSeg").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; st.fuel=b.dataset.f; save("fuel",st.fuel); render(); };
$("main").addEventListener("click",e=>{ const b=e.target.closest("button[data-r]"); if(!b) return; st.range=+b.dataset.r; render(); });
$("region").onchange=()=>{ st.region=$("region").value; save("region",st.region); render(); };

(async()=>{
  try{ st.cfg=await getJSON("config.json"); }catch(e){}
  try{ st.db=await getJSON("data/prices.json"); }catch(e){ st.db={history:[]}; }
  const names=Object.keys((st.db.history.slice(-1)[0]||{}).avg||{}).filter(n=>!n.includes("전국"));
  const want=load("region")||st.cfg.region||"전북";
  st.region = names.find(n=>n===want) || names.find(n=>n.includes(want)) || names[0] || want;
  st.fuel = load("fuel") || st.cfg.fuel || "B027";
  $("region").innerHTML=(names.length?names:[st.region]).map(n=>`<option ${n===st.region?"selected":""}>${esc(n)}</option>`).join("");
  $("upd").textContent = st.db.updated ? "업데이트 "+st.db.updated : "데이터 없음";
  render();
})();
})();
</script>
</body>
</html>
